[workspace]
resolver = "2"
members = ["bounty-hub", "hive-token"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/hivefund/hivefund"

[workspace.dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"

# Size-optimized release profile (profiles must live in the workspace root).
[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
strip = true
panic = "abort"
overflow-checks = true
